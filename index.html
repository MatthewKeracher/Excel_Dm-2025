<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <title>Excel_DM</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/editor.css" />
</head>
<body>

<!-- <div id="logoContainer">
<img id="logo" src="./logo.gif"/>
<p id="gimme">Consider donating some money to keep this project going.</p>
</div> -->

<div id="auth-modal">
  <div id="auth-box">
    <img src="assets/logo.gif" alt="Excel_DM" id="auth-logo" />
    <input id="auth-email" type="email" placeholder="Email" autocomplete="username" />
    <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password" />
    <p id="auth-error"></p>
    <div id="auth-btns">
      <button id="auth-login-btn">Login</button>
      <button id="auth-register-btn">Register</button>
    </div>
    <button id="auth-forgot-btn">Forgot password?</button>
  </div>
</div>

<header>
  <div class="header-content">
     <div class="tabs">
     </div>

    
    <div id="currentTitle" class="header-center"></div>

    
    <div class="header-btns">
      <span id="sync-status" class="sync-status"></span>
      <button title="Add New Note" id="btn-add">Add</button>
      <button title="Spare a Coin." id="btn-donate">Donate</button>
      <button title="Switch campaign world" id="btn-new">Worlds</button>
      <button title="Save to server" id="btn-save">Save</button>
      <button title="Map settings" id="btn-load">Map</button>
      <button title="Account settings" id="btn-account">Account</button>
      <button title="Log out" id="btn-logout" style="display:none">Logout</button>
    </div>
     
  </div>
 
</header>

    <div id="search-box">
     <input id="search-bar" placeholder="Search Entries..."></input>
    </div>

   

    <div class="middle">
    <section class="middle-left">

    <div id="leftPanel"></div>
    
    </section>

    <section class="middle-right">
    <div class="filter"></div>
    <div id="middle-right">
    <canvas id="back-layer"></canvas>
    <canvas id="map-layer"></canvas>
    <canvas id="grid-layer"></canvas>
    <div id="note-layer" class="note-layer"></div>
    </div>
    </section>
    </div>

    


<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/xml/xml.min.js"></script>

<script type="module" src="./src/main.js"></script>

</body>
</html>
